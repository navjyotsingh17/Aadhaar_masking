name: masking_engine_ci_workflow

on:
  pull_request:
               branches:
                        [main]
  push:
      branches:
              [dev]


  workflow_dispatch:            # manual "Run workflow" button
    inputs:
      image_tag:
        description: "Image tag (leave empty to use the commit SHA)"
        required: false
        type: string


jobs:
    build:
          runs-on: ubuntu-latest
          steps:
          - name: Checkout code
            uses: actions/checkout@v5

          - name: Set up python
            uses: actions/setup-python@v4
            with:
              python-version: '3.12'
          
          - name: Install dependencies
            run: |
                  python -m pip install --upgrade pip
                  pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
                  grep -viE '^(uuid|ninja|opencv-python)==' requirements.txt > req-filtered.txt
                  pip install -r req-filtered.txt
                  pip uninstall -y opencv-python opencv-python-headless
                  pip install opencv-python-headless==4.11.0.86


    code-scan:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v5

        - name: Scan dependencies and secrets (Trivy)
          uses: aquasecurity/trivy-action@v0.36.0   # pin to a release tag in real use
          with:
            scan-type: fs
            scan-ref: .
            scanners: vuln,secret
            severity: HIGH,CRITICAL
            ignore-unfixed: true
            exit-code: '1'

        - uses: actions/setup-python@v5
          with:
            python-version: '3.12'

        - name: Static analysis (Bandit)
          run: |
                pip install bandit
                bandit -r . -ll --exclude ./tests,./masking_env,__pycache__


    docker-scan:
      runs-on: ubuntu-latest
      needs: build
      steps:
        - uses: actions/checkout@v5

        - name: Build image
          run: docker build -t ${{ secrets.DOCKER_USERNAME }}/masking_engine:${{ github.run_id || inputs.image_tag }} .

        - name: Scan image (Trivy)
          uses: aquasecurity/trivy-action@v0.36.0   # pin to a release tag in real use
          with:
            image-ref: ${{ secrets.DOCKER_USERNAME }}/masking_engine:${{ github.run_id || inputs.image_tag }}
            severity: HIGH,CRITICAL
            ignore-unfixed: true
            exit-code: '1'

        - name: login to docker
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_TOKEN }}

        - name: Push image to Docker Hub
          run: docker push ${{ secrets.DOCKER_USERNAME }}/masking_engine:${{ github.run_id || inputs.image_tag }}


    update-K8s-manifest:
      runs-on: ubuntu-latest
      needs: docker-scan
      steps:
        - uses: actions/checkout@v5
          with:
                token: ${{ secrets.github_TOKEN }}

        - name: Update K8s manifest with new image tag
          run: |
                sed -i "s|image: .*|image: ${{ secrets.DOCKER_USERNAME }}/masking_engine:${{ github.run_id || inputs.image_tag }}|" kubernetes/deployment-masking-engine.yaml

        - name: Commit and push changes
          run: |
                git config --global user.email "navjyotpulaha@gmail.com"
                git config --global user.name "Navjyotsingh Pulaha"
                git add kubernetes/deployment-masking-engine.yaml
                git commit -m "[CI]: update masking engine image tag"
                git push origin HEAD:${{ github.ref_name }}