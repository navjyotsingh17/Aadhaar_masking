apiVersion: apps/v1
kind: Deployment

metadata:
  name: masking-engine-deployment
  namespace: masking
  labels:
    app.kubernetes.io/name: masking-engine

spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: masking-engine
  
  template:
    metadata:
      labels:
        app.kubernetes.io/name: masking-engine # Selector label in service.yml should match this label
    
    spec:
      serviceAccountName: aadhaar-masking
      containers:
        - name: masking-engine
          image: navjyotsinghpulaha/masking_engine:v0.0.2
          imagePullPolicy: Always
          ports:
            - containerPort: 5000
              name: service
          env:
            - name: secret_key
              valueFrom:
                secretKeyRef:
                  name: secret-key-for-python-engine
                  key: secret_key
            - name: password
              valueFrom:
                secretKeyRef:
                  name: decrypted-password-for-python-engine
                  key: decrypted_password
            - name: db_uri
              valueFrom:
                secretKeyRef:
                  name: db-uri-for-python-engine
                  key: db_uri
            - name: OMP_NUM_THREADS
              value: "1"
            - name: MKL_NUM_THREADS
              value: "1"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"